<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>5-3 Path Following Complex</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <script src="path.js"></script>
    <script src="vehicle.js"></script>
    <script src="snakeSegment.js"></script>
    <script src="snake.js"></script>
    <script src="snakePathFollowing.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <aside id="controls" class="controls">
      <div class="controls__header">
        <h1>Circuit &amp; Serpents</h1>
        <button id="controls-toggle" type="button" class="controls__toggle" aria-expanded="true">Masquer</button>
      </div>
      <div class="controls__content">
        <div class="controls__actions">
          <button id="add-snake-btn" type="button" class="controls__btn">+ Créer un serpent (T)</button>
          <button id="new-path-btn" type="button" class="controls__toggle">Nouveau circuit</button>
          <output id="snake-count" class="controls__badge" aria-live="polite">1 serpent</output>
        </div>

        <div class="controls__row">
          <label for="circuit-complexity">Complexité du circuit</label>
          <input id="circuit-complexity" type="range" min="1" max="10" step="1" value="3">
          <output id="circuit-complexity-value" for="circuit-complexity">3</output>
        </div>

        <div class="controls__row">
          <label for="circuit-width">Largeur du circuit</label>
          <input id="circuit-width" type="range" min="10" max="120" step="1" value="20">
          <output id="circuit-width-value" for="circuit-width">20 px</output>
        </div>

        <div class="controls__row">
          <label for="snake-follow">Poids follow serpent</label>
          <input id="snake-follow" type="range" min="0" max="5" step="0.1" value="2">
          <output id="snake-follow-value" for="snake-follow">2.0</output>
        </div>

        <div class="controls__row">
          <label for="snake-separation">Poids séparation</label>
          <input id="snake-separation" type="range" min="0" max="5" step="0.1" value="1.2">
          <output id="snake-separation-value" for="snake-separation">1.2</output>
        </div>

        <div class="controls__row">
          <label for="snake-spacing">Distance entre anneaux</label>
          <input id="snake-spacing" type="range" min="5" max="80" step="1" value="20">
          <output id="snake-spacing-value" for="snake-spacing">20 px</output>
        </div>

        <div class="controls__row">
          <label for="snake-size">Taille des serpents</label>
          <input id="snake-size" type="range" min="8" max="60" step="1" value="22">
          <output id="snake-size-value" for="snake-size">22 px</output>
        </div>

        <div class="controls__row">
          <label for="entity-spacing">Espacement entités</label>
          <input id="entity-spacing" type="range" min="10" max="120" step="1" value="24">
          <output id="entity-spacing-value" for="entity-spacing">24 px</output>
        </div>

        <label class="controls__checkbox">
          <input id="debug-toggle" type="checkbox">
          <span>Mode Debug (touche D)</span>
        </label>

        <p class="controls__hint">T : ajouter un serpent · W : véhicule Wander · Glisser : ajouter des véhicules</p>
      </div>
    </aside>
  </body>
</html>
